# Quarkus HTTP server
quarkus.http.port=8080

# CORS — required because the Vue dev server (port 5173, when used) and
# the Quarkus backend (port 8080) are different origins. In production
# the Vue app is served by Quarkus at /app, so same-origin; but the CORS
# config does no harm and keeps dev mode flexible.
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

quarkus.log.level=INFO
quarkus.log.console.enable=true

# Jackson: don't fail on unknown JSON properties — useful when the
# Nextcloud API response includes fields this PoC doesn't care about.
quarkus.jackson.fail-on-unknown-properties=false
